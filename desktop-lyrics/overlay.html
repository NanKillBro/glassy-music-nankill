<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Letras en el escritorio</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <header id="toolbar">
    <span id="handle" title="Arrastrá para mover">⠿ Letras</span>
    <button data-action="size" title="Cambiar tamaño de ventana">↔</button>
    <button data-action="smaller" title="Letra más pequeña">A−</button>
    <button data-action="larger" title="Letra más grande">A+</button>
    <button data-action="pin" id="pin" title="Mantener encima de otras ventanas" aria-pressed="true">◇</button>
    <button data-action="lock" title="Dejar pasar clics. Alt+Shift+K para desbloquear">☝</button>
    <button data-action="player" title="Mostrar reproductor">♫</button>
    <button data-action="close" title="Cerrar letras. Alt+Shift+L para abrir">×</button>
  </header>
  <main>
    <div id="lyrics">
    <div id="current" aria-live="off">Esperando letras…</div>
    <div id="next"></div>
    </div>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
